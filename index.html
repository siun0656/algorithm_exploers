/* ===================== 블록 편집기 (자연어·의사코드) ===================== */
class TreeEditor {
  constructor(host, m, prog, o = {}) {
    this.host = host; this.m = m; this.prog = prog; this.o = o;
    this.pc = m.repr === 'pc'; this.sel = null; this.target = null; this.hl = { cur: null, err: new Set() };
    host.classList.add('scroll');
    host.addEventListener('click', e => this.onClick(e));
    this.render();
  }
  locate(uid, list = this.prog, parent = null, branch = null) {
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.uid === uid) return { list, i, b, parent, branch };
      if (b.t === 'rep') { const r = this.locate(uid, b.body, b, 'body'); if (r) return r; }
      if (b.t === 'if') { let r = this.locate(uid, b.then, b, 'then'); if (r) return r; if (b.els) { r = this.locate(uid, b.els, b, 'els'); if (r) return r; } }
    }
    return null;
  }
  listOf(t) { if (!t || t.owner === 'root') return this.prog; const L = this.locate(t.owner); return L ? L.b[t.branch] : null; }
  insert(block) {
    if (this.o.readOnly) return;
    let t = this.target, list = this.listOf(t), idx;
    if (!list || block.t === 'start' || block.t === 'end') { list = this.prog; t = null; }
    if (!t) { idx = list.length; if (list.length && list[list.length - 1].t === 'end' && block.t !== 'end') idx--; if (block.t === 'start') idx = 0; }
    else idx = Math.min(t.idx, list.length);
    list.splice(idx, 0, block);
    this.sel = block.uid;
    if (block.t === 'rep') this.target = { owner: block.uid, branch: 'body', idx: 0 };
    else if (block.t === 'if') this.target = { owner: block.uid, branch: 'then', idx: 0 };
    else if (block.t === 'end') this.target = null;
    else this.target = { owner: t ? t.owner : 'root', branch: t ? t.branch : null, idx: idx + 1 };
    this.changed();
  }
  changed() { this.hl = { cur: null, err: new Set() }; this.render(); this.o.onChange && this.o.onChange(); }
  ownerOf(L) { return L.parent ? { owner: L.parent.uid, branch: L.branch } : { owner: 'root', branch: null }; }
  op(kind, uid) {
    const L = this.locate(uid); if (!L) return;
    const { list, i, b } = L;
    if (kind === 'del') { list.splice(i, 1); this.sel = null; this.target = { ...this.ownerOf(L), idx: i }; }
    else if (kind === 'up') {
      if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
      else if (L.parent) { list.splice(i, 1); const P = this.locate(L.parent.uid); P.list.splice(P.i, 0, b); }
      else return;
    } else if (kind === 'down') {
      if (i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; }
      else if (L.parent) { list.splice(i, 1); const P = this.locate(L.parent.uid); P.list.splice(P.i + 1, 0, b); }
      else return;
    } else if (kind === 'in') {
      const prev = list[i - 1];
      if (!prev || (prev.t !== 'rep' && prev.t !== 'if')) { toast('바로 위에 반복이나 만약 블록이 있어야 안으로 넣을 수 있어요.'); return; }
      list.splice(i, 1); (prev.t === 'rep' ? prev.body : (prev.els || prev.then)).push(b);
    } else if (kind === 'out') {
      if (!L.parent) { toast('이미 맨 바깥에 있어요.'); return; }
      list.splice(i, 1); const P = this.locate(L.parent.uid); P.list.splice(P.i + 1, 0, b);
    } else if (kind === 'else') { b.els = b.els ? null : []; if (b.els) this.target = { owner: b.uid, branch: 'els', idx: 0 }; }
    if (kind !== 'del' && kind !== 'else') { const N = this.locate(uid); this.target = { ...this.ownerOf(N), idx: N.i + 1 }; }
    this.changed();
  }
  onClick(e) {
    if (this.o.readOnly) return;
    const tool = e.target.closest('[data-op]');
    if (tool) { e.stopPropagation(); const op = tool.dataset.op, uid = tool.dataset.u;
      if (op === 'n-' || op === 'n+') { const L = this.locate(uid); L.b.n = Math.max(1, Math.min(10, L.b.n + (op === 'n+' ? 1 : -1))); this.changed(); return; }
      if (op === 'cond') { this.pickCond(uid); return; }
      this.op(op, uid); return; }
    const slot = e.target.closest('.slot');
    if (slot) { this.sel = null; this.target = slot.dataset.o === 'root' ? null : { owner: slot.dataset.o, branch: slot.dataset.b || null, idx: +slot.dataset.i }; this.render(); return; }
    const row = e.target.closest('.row');
    if (row) {
      const uid = row.dataset.u, L = this.locate(uid);
      if (row.classList.contains('elsrow')) { this.sel = null; this.target = { owner: uid, branch: 'els', idx: 0 }; this.render(); return; }
      this.sel = this.sel === uid ? null : uid;
      this.target = { ...this.ownerOf(L), idx: L.i + 1 };
      this.render(); return;
    }
    this.sel = null; this.target = null; this.render();
  }
  pickCond(uid) {
    const L = this.locate(uid), m = this.m;
    const md = modal(`<h2>조건 고르기</h2><p style="color:var(--tx2);margin:0;font-weight:600">어떤 조건에 따라 행동이 달라질까?</p><div class="picklist">${m.palette.conds.map(c => `<button data-c="${c}">${this.pc ? '만약 ' : '만약 '}${esc(m.conds[c][this.pc ? 'pc' : 'nl'])}</button>`).join('')}</div>`);
    $$('[data-c]', md).forEach(b => b.onclick = () => { L.b.c = b.dataset.c; md.close(); this.changed(); });
  }
  txt(b) {
    const m = this.m;
    if (b.t === 'act') return esc(this.pc ? m.acts[b.a].p : m.acts[b.a].t);
    return '';
  }
  stepper(b) { return `<span class="stepper" data-stop>${this.o.readOnly ? '' : `<button data-op="n-" data-u="${b.uid}">−</button>`}<b>${b.n}</b>${this.o.readOnly ? '' : `<button data-op="n+" data-u="${b.uid}">+</button>`}</span>`; }
  cond(b) { const t = esc(this.m.conds[b.c][this.pc ? 'pc' : 'nl']); return this.o.readOnly ? `<span class="condchip" style="--x:0">${t}</span>` : `<button class="condchip" data-op="cond" data-u="${b.uid}">${t}</button>`; }
  tools(b, L) {
    if (this.o.readOnly || this.sel !== b.uid) return '';
    const isBlk = b.t === 'rep' || b.t === 'if';
    return `<span class="tools">
      <button data-op="up" data-u="${b.uid}" title="위로">▲</button><button data-op="down" data-u="${b.uid}" title="아래로">▼</button>
      ${b.t !== 'start' && b.t !== 'end' ? `<button data-op="out" data-u="${b.uid}" title="밖으로 꺼내기">⇤</button><button data-op="in" data-u="${b.uid}" title="위 블록 안으로 넣기">⇥</button>` : ''}
      ${b.t === 'if' ? `<button data-op="else" data-u="${b.uid}" title="아니면 추가/빼기" style="width:auto;padding:0 8px;font-size:12px">${b.els ? '아니면 −' : '아니면 +'}</button>` : ''}
      <button class="del" data-op="del" data-u="${b.uid}" title="삭제">✕</button></span>`;
  }
  render() {
    this.line = 0;
    const html = this.list(this.prog, 'root', null, 0, '');
    const empty = !this.prog.length;
    this.host.innerHTML = `<div class="tree">${html}</div>${empty && !this.o.readOnly ? `<div class="guide"><div>${robot(56, 'think')}<br>왼쪽 ${this.pc ? '명령어' : '명령 카드'}를 눌러<br>알고리즘을 만들어 보자!${this.pc ? '<br><small style="color:var(--pc)">"시작"부터 넣어 볼까?</small>' : ''}</div></div>` : ''}`;

  gut(depth) { return this.pc ? `<span class="gut">${++this.line}</span><span class="ind" style="width:${depth * 30}px"></span>` : ''; }

    if (b.t === 'act') return `<div class="${this.cls(b)}"><div class="row" data-u="${b.uid}">${this.gut(depth)}${pc ? '' : `<span class="no">${num}</span>`}<span>${this.txt(b)}</span>${this.tools(b)}</div></div>`;

      let s = `<div class="${this.cls(b)}"><div class="row" data-u="${b.uid}">${this.gut(depth)}${head}${this.tools(b)}</div><div class="body">${this.list(b.then, b.uid, 'then', depth + 1, num)}</div>`;
      if (b.els) s += `<div class="row elsrow" data-u="${b.uid}">${this.gut(depth)}${pc ? '<span class="kw">아니면:</span>' : '<span class="no" style="opacity:.5">↳</span><span>그렇지 않다면,</span>'}</div><div class="body">${this.list(b.els, b.uid, 'els', depth + 1, num + '′')}</div>`;
      return s + '</div>';
    }

}

/* ===================== 순서도 편집기 ===================== */
class FlowEditor {
  constructor(host, m, fc, o = {}) {
    this.host = host; this.m = m; this.fc = fc; this.o = o;

  text(n) { if (this.o.text) return this.o.text(n); return n.label ? Engine.labelText(this.m, n.label, 'fc') : ''; }
  addNode(shape) {
    const [w] = FG.size[shape], ids = this.fc.nodes.map(n => +String(n.id).replace(/\D/g, '') || 0);
    const id = 'n' + (Math.max(0, ...ids) + 1);
    const bottom = this.fc.nodes.reduce((y, n) => Math.max(y, n.y + FG.wh(n)[1]), 0);
    const W = Math.max(this.wrap.clientWidth, 360);
    const n = { id, shape, label: null, x: Math.max(30, Math.round(W / 2 - w / 2 - 20)), y: bottom ? bottom + 40 : 24 };
    this.fc.nodes.push(n); this.sel = { t: 'n', id }; this.changed();
    setTimeout(() => { const g = $(`.fnode[data-n="${id}"]`, this.wrap); if (g) g.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); this.pickLabel(id); }, 60);
  }
  pickLabel(id) {
    const n = this.fc.nodes.find(x => x.id === id), m = this.m; if (!n) return;
    const opts = [['START', '시작'], ['END', '끝']].concat(m.palette.acts.map(a => [a, m.acts[a].p]), (m.palette.conds || []).map(c => [c, m.conds[c].q]));
    const md = modal(`<div style="display:flex;gap:12px;align-items:center">${FG.mini(n.shape)}<div><h2 style="margin:0">기호에 들어갈 내용 고르기</h2><div style="color:var(--tx2);font-size:14px;font-weight:700">${SHAPE_INFO[n.shape].name} 기호 · ${SHAPE_INFO[n.shape].role}</div></div></div>
      <div class="picklist">${opts.map(([k, t]) => `<button data-k="${k}" style="${n.label === k ? 'box-shadow:inset 0 0 0 2px var(--fc)' : ''}">${esc(t)}</button>`).join('')}</div>
      <div class="row2"><button class="btn ghost sm" data-x>닫기</button></div>`);
    $('[data-x]', md).onclick = md.close;
    $$('[data-k]', md).forEach(b => b.onclick = () => {
      n.label = b.dataset.k;
      if (n.label === 'END') this.fc.edges = this.fc.edges.filter(e => e.from !== n.id);
      if (n.label === 'START') this.fc.edges = this.fc.edges.filter(e => e.to !== n.id);
      if (n.shape !== 'dec') this.fc.edges = this.fc.edges.filter(e => !(e.from === n.id && e.port !== 'out'));
      md.close(); this.changed();
    });
  }
  changed() { this.hl = { cur: null, err: new Set(), edge: null }; this.render(); this.o.onChange && this.o.onChange(); }
  pt(e) { const r = this.svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  bind() {
    const W = this.wrap;
    W.addEventListener('pointerdown', e => {
      if (this.o.readOnly) return;
      if (e.target.closest('.fctool') || e.target.closest('.fcbanner')) return;
      const port = e.target.closest('.port');
      if (port) { e.preventDefault(); this.conn = { from: port.dataset.n, port: port.dataset.port }; this.sel = null; this.render(); return; }
      const g = e.target.closest('.fnode');
      if (g) {
        const n = this.fc.nodes.find(x => x.id === g.dataset.n), [px, py] = this.pt(e);
        this.drag = { n, dx: px - n.x, dy: py - n.y, sx: e.clientX, sy: e.clientY, moved: false, pid: e.pointerId };
        try { W.setPointerCapture(e.pointerId); } catch (_) { }

      }

      if (e.target.closest('svg')) { this.sel = null; this.conn = null; this.render(); }
    });
    W.addEventListener('pointermove', e => {
      const d = this.drag; if (!d) return;

      d.n.x = Math.max(8, Math.round(px - d.dx)); d.n.y = Math.max(8, Math.round(py - d.dy));

    });
    const up = () => {
      const d = this.drag; if (!d) return; this.drag = null;

      if (this.conn) { this.connect(id); return; }
      this.sel = this.sel && this.sel.t === 'n' && this.sel.id === id ? null : { t: 'n', id };

    };
    W.addEventListener('pointerup', up); W.addEventListener('pointercancel', () => { this.drag = null; });
    W.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; e.stopPropagation();
      const a = b.dataset.act;

      if (a === 'deledge') { this.fc.edges.splice(this.sel.i, 1); this.sel = null; this.changed(); }
      if (a === 'cancel') { this.conn = null; this.render(); }
    });
  }
  connect(to) {
    const { from, port } = this.conn, tn = this.fc.nodes.find(n => n.id === to);
    if (from === to) { toast('같은 기호로는 연결할 수 없어요. 다른 기호를 눌러 줘!'); return; }
    if (tn.label === 'START') { toast('"시작" 기호로 들어오는 화살표는 만들 수 없어요.'); this.conn = null; this.render(); return; }
    this.fc.edges = this.fc.edges.filter(e => !(e.from === from && e.port === port));
    this.fc.edges.push({ from, port, to }); this.conn = null; this.changed();
  }
  render(fast) {
    const fc = this.fc, [bw, bh] = FG.bounds(fc);
    const W = Math.max(this.wrap.clientWidth - 2, bw + 60, 300), H = Math.max(this.wrap.clientHeight - 4, bh + 140, 300);
    const svgHtml = FG.draw(fc, {
      text: n => this.text(n), ports: !this.o.readOnly, portOn: this.conn, pfx: 'ed',
      ncls: n => `${this.sel && this.sel.t === 'n' && this.sel.id === n.id ? 'sel' : ''} ${this.hl.cur === n.id ? 'cur' : ''} ${this.hl.err.has(n.id) ? 'err' : ''}`,
      ecls: (e, i) => `${this.sel && this.sel.t === 'e' && this.sel.i === i ? 'sel' : ''} ${this.hl.edge && this.hl.edge.from === e.from && this.hl.edge.port === e.port ? 'cur' : ''}`
    });
    const st = this.wrap.scrollTop;
    let tool = '';
    if (!this.o.readOnly && this.sel && !this.drag) {
      if (this.sel.t === 'n' && !this.o.lock) { const n = fc.nodes.find(x => x.id === this.sel.id); if (n) { const [w] = FG.wh(n); const x = Math.min(n.x + w + 10, W - 190); tool = `<div class="fctool" style="left:${x}px;top:${n.y}px"><button class="btn sm pri" data-act="label">내용 고르기</button><button class="btn sm bad" data-act="delnode">삭제</button></div>`; } }
      if (this.sel.t === 'e') { const e = fc.edges[this.sel.i], a = e && fc.nodes.find(n => n.id === e.from), b = e && fc.nodes.find(n => n.id === e.to); if (a && b) { const mx = (a.x + b.x) / 2 + 60, my = (a.y + b.y) / 2 + 30; tool = `<div class="fctool" style="left:${Math.min(mx, W - 140)}px;top:${my}px"><button class="btn sm bad" data-act="deledge">화살표 삭제</button></div>`; } }
    }
    const banner = this.conn ? `<div class="fcbanner">🔗 ${this.conn.port === 'yes' ? '"예"일 때' : this.conn.port === 'no' ? '"아니오"일 때' : '다음에'} 이어질 기호를 눌러 줘! <button data-act="cancel">취소</button></div>` : '';
    this.wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svgHtml}</svg>${tool}${banner}
      ${!fc.nodes.length && !this.o.readOnly ? `<div class="guide"><div>${robot(56, 'think')}<br>${this.o.where || '왼쪽'}에서 순서도 기호를 눌러 놓아 보자!<br><small style="color:var(--fc)">기호를 놓으면 들어갈 내용을 고를 수 있어.</small></div></div>` : ''}`;
    this.svg = $('svg', this.wrap); this.wrap.scrollTop = st;
    if (!fast) { const c = $('.fnode.cur', this.wrap); if (c) { const bb = c.getBBox(); if (bb.y < this.wrap.scrollTop || bb.y + bb.height > this.wrap.scrollTop + this.wrap.clientHeight) this.wrap.scrollTo({ top: bb.y - 60, behavior: 'smooth' }); } }
  }
  setHL(cur, errs, edge) { this.hl = { cur: cur || null, err: new Set(errs || []), edge: edge || null }; this.render(); }
}

const App = { teacher: false, cleanup: null };

function go(name, arg) {

function bindTeacher(root) {

function askCode() {
  let code = '';
  const md = modal(`<div style="text-align:center">${robot(60, 'think')}<h2 style="margin-top:6px">교사용 정답 확인</h2><p style="margin:0;color:var(--tx2);font-weight:600">교사 코드 4자리를 입력해 주세요.</p>

    }, 180);
  };
  $$('[data-k]', md).forEach(b => b.onclick = () => press(b.dataset.k));
  const kh = e => { if (!document.body.contains(md)) return document.removeEventListener('keydown', kh); if (/^[0-9]$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('c'); if (e.key === 'Escape') press('x'); };

}

function quiz(host, q, opts, ans, why) {
  const el = h(`<div class="act quiz"><div class="q">✅ 확인 활동 · ${q}</div><div class="qopts">${opts.map((o, i) => `<button class="qopt" data-i="${i}">${o}</button>`).join('')}</div><div class="qfb"></div></div>`);
  $$('.qopt', el).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, fb = $('.qfb', el);
    $$('.qopt', el).forEach(x => x.classList.remove('wrong'));
    if (i === ans) { b.classList.add('right'); fb.innerHTML = `<span style="color:var(--ok)">정답이야! ${why}</span>`; }
    else { b.classList.add('wrong'); fb.innerHTML = `<span style="color:var(--bad)">다시 생각해 보자!</span>`; }
  });
  host.appendChild(el);
}

}

    s += it(56, 58, kidSVG(w.worn || 'none'), '', ev && ev.fx === 'wear' ? 'fx-pop' : '');
    const nm = { coat: '🧥 두꺼운 외투', jacket: '🧥 가벼운 겉옷', tee: '👕 얇은 옷' };

    if (ev && ev.kind === 'br') s += it(50, 14, `<span class="hudbox">◆ ${MISSIONS[9].conds[ev.c].q} → <b>${ev.v ? '예' : '아니오'}</b></span>`, '', 'fx-pop');
    return s + `<div class="hud" style="left:10px;top:10px"><span class="hudbox">🌱 확인한 식물 <b>${w.checked.filter(Boolean).length}</b>/3</span>${ctx && ctx.loop ? `<span class="hudbox" style="color:var(--rep)">🔁 반복 <b>${ctx.loop.iter}</b>/${ctx.loop.n}</span>` : ''}</div>`;
  }
};

/* ===================== 실행 제어기 ===================== */
class RunCtl {
  constructor(M) { this.M = M; this.state = 'idle'; this.timer = null; this.hintLv = {}; this.fast = false; }
  get delay() { return this.fast ? 380 : 850; }
  prepare() {
    const M = this.M, m = M.m;
    M.clearHint(); M.clearLog(); M.say(null);
    const se = m.repr === 'fc' ? Engine.checkFlow(m, M.work) : Engine.checkTree(m, M.work);
    if (se.length) {
      M.ed.setHL(null, se.map(e => e.src).filter(Boolean));
      M.status('bad', '✖ 알고리즘을 실행하기 전에 고칠 부분이 있어요.' + (se.some(e => e.src) ? ' 빨갛게 표시된 곳을 살펴보자!' : ''));
      M.log('✖ ' + (m.repr === 'pc' ? '문법' : '구조') + ' 검사: 고칠 곳 ' + se.length + '개', 'e');
      M.hint(se[0]); this.fail(); this.state = 'done'; M.sync(); return false;
    }
    this.cfg = Engine.compile(m, M.work);
    this.queue = m.scenarioUI === 'all' ? m.scenarios.map((_, i) => i) : [null];
    this.qi = 0; this.ctx = { acc: {}, loop: null, si: 0 };
    this.loadSc(); return true;
  }
  loadSc() {
    const M = this.M, m = M.m, q = this.queue[this.qi];
    this.sc = q === null ? M.curSc() : m.scenarios[q];
    this.world = m.init(this.sc); this.r = Engine.runner(this.cfg, m, this.world); this.events = []; this.prevEdge = null;
    this.ctx.si = this.qi; this.ctx.loop = null;
    if (this.queue.length > 1) M.log('── ' + (this.qi + 1) + '번째: ' + this.sc.label + ' ──', 'b');
    M.scene(this.world, null, this.sc, this.ctx);
    M.status('run', '▶ ' + (this.queue.length > 1 ? this.sc.label + ' 처리 중…' : '알고리즘을 실행하고 있어요…'));
  }
  run() {
    if (this.state === 'running') return;
    if (this.state !== 'paused' && !this.prepare()) return;
    this.state = 'running'; this.M.setStep(3); this.M.sync(); this.loop();
  }
  loop() { clearTimeout(this.timer); this.timer = setTimeout(() => { if (this.state !== 'running') return; if (this.tick()) this.loop(); }, this.delay); }
  step() {
    if (this.state === 'running') { clearTimeout(this.timer); this.state = 'paused'; }
    if (this.state === 'idle' || this.state === 'done') { if (!this.prepare()) return; this.state = 'paused'; this.M.setStep(3); }
    this.tick(); this.M.sync();
  }
  pause() { if (this.state !== 'running') return; clearTimeout(this.timer); this.state = 'paused'; this.M.status('', '⏸ 일시정지! "실행하기"로 이어서 실행하거나 "한 단계씩"으로 한 줄씩 볼 수 있어요.'); this.M.sync(); }
  restart() { this.stop(); this.run(); }
  stop() { clearTimeout(this.timer); this.state = 'idle'; if (this.M.ed) this.M.ed.setHL(null, []); this.M.sync(); }
  end() { clearTimeout(this.timer); this.state = 'done'; this.M.sync(); }
  fail() { if (!this.M.demo) { const id = this.M.m.id; Store.d.fails[id] = (Store.d.fails[id] || 0) + 1; Store.save(); } }
  tick() {
    const M = this.M, m = M.m;
    const ev = this.r.step(); if (!ev) return false;
    this.events.push(ev);
    if (ev.kind === 'loop') this.ctx.loop = { iter: ev.iter, n: ev.n };
    if (m.repr === 'fc') { M.ed.setHL(ev.src, [], ev.src ? this.prevEdge : null); this.prevEdge = ev.kind === 'br' ? { from: ev.src, port: ev.v ? 'yes' : 'no' } : ev.src ? { from: ev.src, port: 'out' } : null; }
    else M.ed.setHL(ev.src, []);
    M.logEv(ev);
    M.scene(this.world, ev, this.sc, this.ctx);
    if (ev.kind === 'error') {
      this.end(); if (ev.src) M.ed.setHL(null, [ev.src]);
      M.status('bad', '✖ ' + ev.err.say); M.say(ev.err.say, 'bad'); M.hint(ev.err); this.fail(); return false;
    }
    if (ev.kind === 'end') {
      const g = m.judge(this.world, this.sc, this.events);
      if (g) { this.end(); M.status('bad', '✖ ' + g.say); M.say(g.say, 'bad'); M.log('✖ ' + g.say, 'e'); M.hint(g); this.fail(); return false; }
      if (this.qi < this.queue.length - 1) {
        M.log('✔ ' + this.sc.label + ' 처리 완료', 'o');
        this.qi++;
        if (this.state === 'running') { this.timer = setTimeout(() => { if (this.state === 'running') { this.loadSc(); this.loop(); } }, 650); }
        else this.loadSc();
        return false;
      }
      this.finish(); return false;
    }
    return true;
  }
  finish() {
    const M = this.M, m = M.m; this.end();
    const v = Engine.verify(m, M.work);
    if (v.ok) {
      M.ed.setHL(null, []);
      M.status('ok', '✔ 올바른 실행 결과가 확인되었어요!'); M.say('미션 성공! 🎉', 'ok'); M.log('★ 모든 상황에서 검증 통과!', 'o');
      if (M.demo) { M.status('ok', '✔ 정답 알고리즘 실행 완료 (교사용 화면이라 기록되지 않아요)'); return; }
      M.success(); return;
    }
    this.fail();
    if (v.phase === 'struct') { M.status('bad', '△ ' + v.err.say); M.say(v.err.say, 'bad'); M.hint(v.err); return; }
    const other = v.sc.label;
    M.status('bad', `△ 지금 상황(${this.sc.label})에서는 잘 됐어! 그런데 "${other}"일 때는 문제가 생겨요.`);
    M.log('△ "' + other + '" 상황 검증 실패: ' + v.err.say, 'e');
    M.hint(v.err, m.scenarioUI && m.scenarioUI !== 'all' ? { label: `"${other}"(으)로 실행해 보기`, fn: () => { M.setScenario(v.sc); this.restart(); } } : null);
  }
}

function traceOf(m, sc) {
  const cfg = Engine.compile(m, m.answer()), w = m.init(sc), r = Engine.runAll(cfg, m, w), T = l => Engine.labelText(m, l, m.repr);
  return r.events.map(ev => ev.kind === 'do' ? '▶ ' + T(ev.a) : ev.kind === 'br' ? '◆ ' + (m.repr === 'fc' ? T(ev.c) : '만약 ' + T(ev.c)) + ' → ' + (ev.v ? '예' : '아니오') : ev.kind === 'loop' ? '🔁 반복 ' + ev.iter + '/' + ev.n + '번째' : ev.kind === 'mark' ? '● ' + (ev.label === 'start' ? '시작' : '끝') : ev.kind === 'end' ? '■ 실행 완료 → 목표 달성' : '✖ ' + ev.err.say);
}

      ${scs.length > 1 ? `<h4 style="margin-top:14px">🧪 검증하는 상황 (${m.scenarios.length}가지)</h4><p style="font-size:14px">${m.scenarios.map(x => x.label).join(' · ')}</p>` : ''}</div></div>
     <div class="card" style="margin-top:16px"><h4>⚠️ 학생들이 자주 틀리는 부분</h4><ol class="nlist">${m.pitfalls.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>
     <div class="card" style="margin-top:16px"><h4>📊 이 브라우저의 학생 기록</h4><p>${Store.d.cleared[m.id] ? '✔ 성공 · 별 ' + Store.d.cleared[m.id].stars + '개' : '아직 성공하지 않음'} · 오류 수정 횟수 ${Store.d.fails[m.id] || 0}회</p></div>`;

    $('[data-demo]', det).onclick = () => go('mission', { id: m.id, demo: true });

   기초 연습모드 (2단계) — 활동 엔진
   모든 활동은 ACT[type](host, a, P) 형태로 동작한다.
   P: say(html, mood) · how(list) · done(msg) · wrong() · setReveal(fn) · every/after(타이머)
===================================================================== */
const ENC = ['괜찮아! 다시 생각해 보자.', '조금만 더 생각하면 해결할 수 있어!', '실수해도 괜찮아. 한 번 더 해 보자!', '좋은 시도였어! 다시 살펴볼까?'];
const enc = () => ENC[Math.floor(Math.random() * ENC.length)];
const shuffle = (arr, seed = 7) => { const a = arr.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 드래그 앤 드롭 + 눌러서 고르기 ---------- */
function dnd(root, opt) {
  let sel = null;
  const clear = () => { $$('.picked', root).forEach(x => x.classList.remove('picked')); sel = null; };
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-drag]');
    if (!el || !root.contains(el) || el.classList.contains('locked') || e.button > 0) return;
    if (e.target.closest('button') && e.target.closest('button') !== el) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
    const move = ev => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        const r = el.getBoundingClientRect(); ghost = el.cloneNode(true); ghost.classList.add('ghost');
        ghost.style.cssText += `;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;margin:0;pointer-events:none;z-index:95`;
        ghost._dx = sx - r.left; ghost._dy = sy - r.top; document.body.appendChild(ghost); el.classList.add('dragging');
      }
      ev.preventDefault();
      ghost.style.left = (ev.clientX - ghost._dx) + 'px'; ghost.style.top = (ev.clientY - ghost._dy) + 'px';
      const t = document.elementFromPoint(ev.clientX, ev.clientY), d = t && t.closest('[data-drop]');
      if (over !== d) { if (over) over.classList.remove('over'); over = d && root.contains(d) ? d : null; if (over) over.classList.add('over'); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (ghost) { ghost.remove(); el.classList.remove('dragging'); if (over) { over.classList.remove('over'); clear(); opt.onDrop(el, over, ev); } return; }
      if (opt.onTap && opt.onTap(el) === true) return;
      if (sel && sel.dataset.drag === el.dataset.drag) { clear(); return; }
      clear(); sel = el; el.classList.add('picked'); opt.onPick && opt.onPick(el);
    };
    window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  root.addEventListener('click', e => {
    const d = e.target.closest('[data-drop]'); if (!d || !sel || e.target.closest('[data-drag]')) return;
    const s = sel; clear(); opt.onDrop(s, d, e);
  });
  return { clear };
}

/* ---------- 작은 무대(실행 화면) 그림 ---------- */
const AE = { clap: '👏', jump: '🤸', wave: '👋', sit: '🧎', raise: '🙌', water: '💧', pick: '✂️', dig: '⛏️', up: '🧗', stomp: '🦶' };
const PSC = {
  counter(k, act, label, total) {
    return `<div class="pstage sky"><div class="pbig"><span class="pkid">🧒</span>${k ? `<span class="pact" key="${k}">${AE[act] || '❓'}</span>` : ''}</div>
      <div class="pcount"><b>${k}</b><span>${label}</span></div>${total ? `<div class="pdots">${Array.from({ length: Math.max(total, k) }, (_, i) => `<i class="${i < k ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>`;
  },
  jump(k, act) {
    return `<div class="pstage gym"><div class="pbig" style="${k ? 'animation:jump .45s ease' : ''}" key="${k}">${act === 'jump' || !k ? kidSVG('tee', { w: 90, h: 124 }) : `<span style="font-size:70px">${AE[act]}</span>`}</div><div class="pcount"><b>${k}</b><span>${act === 'jump' || !k ? '점프' : '번'}</span></div></div>`;
  },
  water(k, act, over) {

      ${over ? '<div class="pwarn">💦 물을 줄 화분이 없는데 또 물을 주었어!</div>' : ''}${act && act !== 'water' && k ? `<div class="pwarn">${AE[act]} ${k}번! 그런데 물은 아직이야…</div>` : ''}
      <div class="pcount" style="right:12px;left:auto"><b>${act === 'water' ? Math.min(k, 3) : 0}</b><span>/3 물 줌</span></div></div>`;
  },
  stairs(k) {
    let s = ''; for (let j = 0; j < 5; j++) s += `<rect x="${40 + j * 80}" y="${200 - (j + 1) * 30}" width="80" height="${(j + 1) * 30}" fill="${j < k ? '#3a6ad0' : '#24407e'}" stroke="#5f8de8" stroke-opacity=".5"/>`;
    const kk = Math.min(k, 5), rx = kk === 0 ? 0 : 40 + (kk - 1) * 80 + 18, ry = 200 - kk * 30 - 44;
    return `<div class="pstage sky"><svg viewBox="0 0 480 220" style="position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)">${s}<text x="${40 + 4 * 80 + 40}" y="${200 - 150 - 50}" font-size="30" text-anchor="middle">🚩</text><g transform="translate(${rx},${ry})">${robot(44, k > 5 ? 'oops' : 'happy')}</g>${k > 5 ? '<text x="440" y="20" font-size="26">💥</text>' : ''}</svg><div class="pcount"><b>${k}</b><span>칸 오름</span></div></div>`;
  },
  weather(rain, act, title) {
    const umb = act === 'umb', wet = rain && act && !umb;
    const extra = umb ? `<g transform="translate(${rain ? 0 : 66},${rain ? -38 : 50}) ${rain ? '' : 'rotate(-20)'}"><path d="M${rain ? 10 : 0} ${rain ? 24 : 0} Q50 ${rain ? -14 : 0} ${rain ? 90 : 0} ${rain ? 24 : 0} Z" fill="#ff6b7a"/>${rain ? '<line x1="50" y1="12" x2="50" y2="70" stroke="#333" stroke-width="3"/>' : '<rect x="-4" y="-30" width="9" height="40" rx="4" fill="#ff6b7a"/>'}</g>` : '';
    return `<div class="pstage ${rain ? 'rainy' : 'sunny'}">${rain ? `<div class="prain">${Array.from({ length: 22 }, (_, i) => `<i style="left:${(i * 41) % 100}%;animation-delay:${(i % 6) * .12}s"></i>`).join('')}</div>` : '<div class="psun"></div>'}
      <div class="pbig" style="bottom:4px">${kidSVG('jacket', { w: 84, h: 116, extra: extra + (wet ? '<text x="72" y="12" font-size="22">💦</text>' : '') })}</div>
      ${title ? `<div class="plabel">${title}</div>` : ''}${act ? `<div class="presult ${(rain && umb) || (!rain && !umb) ? 'ok' : 'bad'}">${rain && umb ? '☂️ 젖지 않았어!' : rain ? '💦 흠뻑 젖었어!' : umb ? '😓 짐만 무거워…' : '😊 가볍게 출발!'}</div>` : ''}</div>`;
  },
  signal(green, act) {
    const ok = act && ((green && act === 'walk') || (!green && act === 'wait'));
    return `<div class="pstage road"><div class="plight"><i class="${green ? '' : 'on r'}"></i><i class="${green ? 'on g' : ''}"></i></div>
      <div class="pzebra"></div><div class="pbig" style="left:${act === 'walk' || act === 'run' ? 62 : 22}%;bottom:16px;font-size:58px">${act === 'wait' ? '🧍' : act ? '🚶' : '🧍'}</div>
      ${!green && (act === 'walk' || act === 'run') ? '<div class="pbig" style="left:84%;bottom:10px;font-size:48px">🚗</div>' : ''}
      ${act ? `<div class="presult ${ok ? 'ok' : 'bad'}">${ok ? (green ? '🚶 안전하게 건넜어!' : '✋ 잘 기다렸어!') : green ? '😕 초록불인데 계속 서 있어…' : '⚠️ 빨간불에 건너면 위험해!'}</div>` : ''}</div>`;
  },
  homework(has, act) {
    const ok = act && ((has && act === 'hw') || (!has && act === 'play'));
    return `<div class="pstage room2"><div class="plabel">${has ? '📚 숙제가 남아 있어요' : '✅ 숙제를 다 했어요'}</div>
      <div class="pbig" style="font-size:66px">${act === 'hw' ? '🧒📝' : act === 'play' ? '🧒🛝' : act === 'nap' ? '😴' : '🧒'}</div>
      ${act ? `<div class="presult ${ok ? 'ok' : 'bad'}">${ok ? (has ? '📝 숙제 먼저 끝내자!' : '🛝 신나게 놀자!') : '🤔 이 상황에 맞는 행동일까?'}</div>` : ''}</div>`;
  },
  temp(t, coat) {
    return `<div class="pstage" style="background:linear-gradient(180deg,${t < 10 ? '#3f5f9e,#9ab8e4' : '#ff9e5e,#ffd8a0'})"><div class="plabel">${t < 10 ? '🥶' : '🥵'} 기온 ${t}℃</div><div class="pbig">${kidSVG(coat ? 'coat' : 'tee', { w: 90, h: 124 })}</div><div class="presult ok">${coat ? '🧥 외투를 입어요' : '👕 외투를 입지 않아요'}</div></div>`;
  }
};

/* 순서대로 하나씩 보여 주는 애니메이션 */
function playSeq(el, steps, P, onDone, ms = 850) {
  let k = -1;
  const draw = () => {
    el.innerHTML = `<div class="pplay">${steps.map((s, i) => `<div class="pstep ${i < k ? 'past' : ''} ${i === k ? 'now' : ''}"><span class="e">${s.e}</span><span class="t">${i + 1}. ${esc(s.t)}</span></div>${i < steps.length - 1 ? '<span class="parr">➜</span>' : ''}`).join('')}</div>`;
  };
  draw();
  const tick = () => { k++; draw(); if (k < steps.length) P.after(tick, ms); else onDone && onDone(); };
  P.after(tick, 350);
}

const ACT = {};

/* ========== 강의(STEP 1) ========== */
ACT.lesson = (host, a, P) => {
  let i = 0;
  const show = () => {
    P.clearTimers();
    const sl = a.slides[i];
    P.say(sl.say, sl.mood || 'happy');
    P.how(['그림을 보면서 선생님 설명을 읽어 봐.', i < a.slides.length - 1 ? '다 읽었으면 <b>다음 설명 ▶</b>을 눌러.' : '다 이해했으면 <b>이해했어요!</b>를 눌러.']);
    host.innerHTML = `<div class="plesson"><div class="pview" data-view></div>
      <div class="pnav"><button class="btn ghost sm" data-lprev ${i ? '' : 'disabled'}>◀ 이전 설명</button><span class="pdots2">${a.slides.map((_, j) => `<i class="${j === i ? 'on' : j < i ? 'past' : ''}"></i>`).join('')}</span>
      ${i < a.slides.length - 1 ? '<button class="btn pri" data-lnext>다음 설명 ▶</button>' : '<button class="btn go" data-lok>이해했어요! ✔</button>'}</div></div>`;
    const v = $('[data-view]', host);
    sl.view(v, P);
    $('[data-lprev]', host).onclick = () => { i--; show(); };
    const n = $('[data-lnext]', host); if (n) n.onclick = () => { i++; show(); };
    const ok = $('[data-lok]', host); if (ok) ok.onclick = () => P.done(a.doneMsg || '좋아! 이제 직접 해 보자. <b>다음 →</b>을 눌러 줘!');
  };
  show();
};

/* ========== 카드 순서 배열 (자연어·의사코드 스타일 포함) ========== */
ACT.order = (host, a, P) => {
  const N = a.items.length, poolOrder = a.pool || shuffle(a.items.map((_, i) => i), a.seed || N * 3 + 1);
  let placed = a.fix ? a.fix.initial.slice() : [], phase = a.fix ? 'find' : 'build', solved = false, bad = -1, tries = 0;
  const style = a.style || 'card';
  const label = (i, pos) => style === 'nl' ? `<span class="pno">${pos + 1}</span><span>${esc(a.items[i].t)}</span>` : style === 'pc' ? `<span class="pgut">${pos + 1}</span><span class="${a.items[i].kw ? 'kw2' : ''}">${esc(a.items[i].t)}</span>` : `<span class="pe">${a.items[i].e}</span>${esc(a.items[i].t)}`;
  P.how(a.fix ? ['① 완성된 알고리즘을 읽어 봐.', '② <b>순서가 이상한 카드</b>를 눌러 찾아 봐.', '③ 찾았다면 카드를 끌거나 ▲▼ 버튼으로 순서를 고쳐 봐.', '④ <b>▶ 실행해 보기</b>로 확인!']
    : a.guided ? ['① 오른쪽 카드 중에서 <b>첫 번째로 할 일</b>을 눌러 봐.', '② 카드를 하나 고를 때마다 선생님이 바로 알려 줄게.', '③ 카드를 끌어서 왼쪽 칸에 놓아도 돼!']
      : ['① 카드를 눌러서(또는 끌어서) 알고리즘 칸에 순서대로 넣어 봐.', '② 순서를 바꾸고 싶으면 칸 안의 카드를 끌어 옮기거나 ▲▼를 눌러.', '③ 카드를 빼려면 ✕를 눌러.', '④ 다 넣었으면 <b>▶ 실행해 보기</b>!']);
  const render = () => {
    const pool = poolOrder.filter(i => !placed.includes(i));
    host.innerHTML = `<div class="porder ${style}">
      <div class="pcol"><div class="psub">${style === 'pc' ? '⌨️ 의사코드' : '🧩 나의 알고리즘'} <small>${placed.length}/${N}</small></div>
        <div class="plist ${style === 'pc' ? 'code' : ''}" data-drop="list">${placed.map((i, p) => `<div class="pcard2 ${p === bad ? 'bad' : ''} ${solved ? 'good' : ''}" data-drag="L${p}" data-i="${i}">${label(i, p)}
          ${!solved && !a.guided && phase !== 'find' ? `<span class="ptools"><button data-mv="${p},-1">▲</button><button data-mv="${p},1">▼</button>${a.fix ? '' : `<button data-rm="${p}" class="del">✕</button>`}</span>` : ''}</div>`).join('')}
          ${Array.from({ length: N - placed.length }, (_, k) => `<div class="pslot">${placed.length + k + 1}번째 자리${k === 0 && !a.fix ? ' · 여기에 놓아 줘' : ''}</div>`).join('')}</div></div>
      ${a.fix ? '' : `<div class="pcol"><div class="psub">🃏 카드 보관함 <small>눌러서 넣기</small></div><div class="plist pool" data-drop="pool">${pool.map(i => `<div class="pcard2" data-drag="P${i}" data-i="${i}">${style === 'card' ? `<span class="pe">${a.items[i].e}</span>${esc(a.items[i].t)}` : esc(a.items[i].t)}</div>`).join('') || '<div class="pempty">모든 카드를 넣었어! 👍</div>'}</div></div>`}
    </div>
    <div class="pact-row">${!a.guided ? `<button class="btn go" data-run ${placed.length < N || solved || phase === 'find' ? 'disabled' : ''}>▶ 실행해 보기</button>` : ''}<div class="pplayhost" data-play></div></div>`;
    ctl.clear();
    const r = $('[data-run]', host); if (r) r.onclick = check;
  };
  const place = (i, at) => {
    if (solved) return;
    if (a.guided) {
      const want = placed.length;
      if (i === want) { placed.push(i); render(); P.say((a.okMsgs && a.okMsgs[want]) || '좋아! 잘 골랐어.', 'yay'); if (placed.length === N) finish(); }
      else { P.wrong(); P.say(`${a.items[i].early || '이 행동을 하기 전에 먼저 해야 할 일이 있을까?'}<br><small>${enc()}</small>`, 'think'); const c = $(`[data-drag="P${i}"]`, host); if (c) { c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 450); } }
      return;
    }
    if (at == null || at > placed.length) at = placed.length;
    placed.splice(at, 0, i); bad = -1; render();
    if (placed.length === N) P.say('카드를 모두 넣었어! <b>▶ 실행해 보기</b>를 눌러서 확인해 볼까?', 'happy');
  };
  const idxAt = (list, y) => { const cs = $$('.pcard2', list); let k = 0; cs.forEach(c => { const r = c.getBoundingClientRect(); if (y > r.top + r.height / 2) k++; }); return k; };
  const ctl = dnd(host, {
    onTap: el => {
      const id = el.dataset.drag;
      if (phase === 'find' && id[0] === 'L') {
        const i = +el.dataset.i;
        if (a.fix.culprits.includes(i)) { phase = 'fix'; render(); P.say(a.fix.why, 'yay'); P.how(['카드를 끌거나 ▲▼ 버튼으로 순서를 바로잡아 봐.', '다 고쳤으면 <b>▶ 실행해 보기</b>!']); }
        else { P.wrong(); P.say(`"${esc(a.items[i].t)}"는 제자리에 있는 것 같아. 다른 카드를 살펴볼까?<br><small>${a.fix.findHint || '앞뒤 카드와 비교해서 "이걸 먼저 해도 될까?" 하고 생각해 봐.'}</small>`, 'think'); }
        return true;
      }
      if (id[0] === 'P') { place(+el.dataset.i); return true; }
      return true;
    },
    onDrop: (el, d, ev) => {
      const id = el.dataset.drag; if (solved || phase === 'find') return;
      if (id[0] === 'P' && d.dataset.drop === 'list') place(+el.dataset.i, a.guided ? null : idxAt(d, ev.clientY));
      else if (id[0] === 'L' && d.dataset.drop === 'list' && !a.guided) { const from = +id.slice(1), i = placed[from]; placed.splice(from, 1); let to = idxAt(d, ev.clientY); placed.splice(to, 0, i); bad = -1; render(); }
      else if (id[0] === 'L' && d.dataset.drop === 'pool' && !a.guided && !a.fix) { placed.splice(+id.slice(1), 1); bad = -1; render(); }
    }
  });
  host.addEventListener('click', e => {
    const mv = e.target.closest('[data-mv]'), rm = e.target.closest('[data-rm]');
    if (mv) { const [p, d] = mv.dataset.mv.split(',').map(Number), q = p + d; if (q < 0 || q >= placed.length) return;[placed[p], placed[q]] = [placed[q], placed[p]]; bad = -1; render(); }
    if (rm) { placed.splice(+rm.dataset.rm, 1); bad = -1; render(); }
  });
  const check = () => {
    const k = placed.findIndex((i, p) => i !== p);
    if (k < 0) { finish(); return; }
    tries++; P.wrong(); bad = k; render();
    const it = a.items[placed[k]];
    P.say(`🔎 <b>${k + 1}번째 카드</b>에서 문제가 생겼어!<br>${it.early || '이 행동을 하기 전에 먼저 해야 할 일이 있을까?'}<br><small>${enc()}</small>`, 'oops');
  };
  const finish = () => {
    solved = true; bad = -1; render();
    P.say('좋아! 네가 만든 순서대로 실행해 볼게. 잘 봐!', 'happy');
    playSeq($('[data-play]', host), a.items.map(x => ({ e: x.e || '▸', t: x.t })), P, () => P.done(a.final || '순서대로 하나씩 실행해서 성공했어!'));
  };
  P.setReveal(() => { placed = a.items.map((_, i) => i); phase = 'fix'; solved = true; bad = -1; render(); P.say('이게 올바른 순서야. 카드를 하나씩 읽으며 <b>왜 이 순서인지</b> 생각해 보고, <b>↺ 다시 하기</b>로 직접 풀어 봐!', 'think'); });
  render();
  if (a.fix) P.say(a.intro || '이 알고리즘에는 <b>순서가 잘못된 곳</b>이 있어. 이상한 카드를 눌러서 찾아볼까?', 'think');
  else if (a.intro) P.say(a.intro, 'happy');
};

/* ========== 반복 블록 만들기 ========== */
ACT.repeat = (host, a, P) => {
  let act = a.fix ? a.fix.a : null, n = a.fix ? a.fix.n : 1, running = false, ranOnce = false, solved = false;
  const style = a.style || 'card', T = a.target;
  const actT = id => (a.actions.find(x => x.id === id) || {}).t;
  P.how(a.fix ? ['① 먼저 <b>▶ 실행하기</b>를 눌러서 무엇이 잘못됐는지 확인해 봐.', '② 문제를 찾았으면 − / + 버튼으로 반복 횟수를 고쳐 봐.', '③ 다시 실행해서 확인!']
    : ['① 반복할 행동 카드를 <b>반복 블록 안 빈칸</b>으로 끌어오거나 눌러 봐.', '② − / + 버튼으로 <b>반복 횟수</b>를 정해 봐.', '③ <b>▶ 실행하기</b>를 눌러 결과를 확인해!']);
  const blockHTML = () => {
    const st = `<span class="stepper"><button data-n="-1" ${a.fix && !ranOnce ? 'disabled' : ''}>−</button><b>${n}</b><button data-n="1" ${a.fix && !ranOnce ? 'disabled' : ''}>+</button></span>`;
    const head = style === 'pc' ? `${st}<span class="kw">번 반복하기:</span>` : style === 'nl' ? `<span>다음을</span>${st}<span>번 반복한다.</span>` : `<span>🔁</span>${st}<span>번 반복하기</span>`;
    const body = act ? `<div class="pcard2 in ${a.fix ? 'locked' : ''}" data-drag="B">${style === 'card' ? `<span class="pe">${AE[act]}</span>` : ''}${esc(actT(act))}${a.fix ? '' : '<span class="ptools"><button data-rm class="del">✕</button></span>'}</div>` : '<div class="pslot">여기에 반복할 행동을 넣어 줘</div>';
    return `<div class="prep ${style}"><div class="prep-h">${head}</div><div class="prep-b" data-drop="body">${body}</div>${style === 'pc' ? '' : '<div class="prep-f"></div>'}</div>`;
  };
  const render = (k = 0, curAct = null, over = false) => {
    host.innerHTML = `<div class="prepwrap">
      <div class="pcol" style="flex:1.1">${a.situation ? `<div class="psit">${a.situation}</div>` : ''}${blockHTML()}
        ${a.fix ? '' : `<div class="psub" style="margin-top:12px">🃏 행동 카드</div><div class="plist pool row" data-drop="pool">${a.actions.map(x => `<div class="pcard2 ${act === x.id ? 'used' : ''}" data-drag="A${x.id}"><span class="pe">${AE[x.id]}</span>${esc(x.t)}</div>`).join('')}</div>`}
        <div class="pact-row"><button class="btn go" data-run ${running ? 'disabled' : ''}>▶ 실행하기</button></div></div>
      <div class="pcol" style="flex:1"><div class="psub">🖥️ 실행 화면</div><div class="pscene" data-scene>${pscene(k, curAct || act, over)}</div></div></div>`;
    ctl.clear();
    $('[data-run]', host).onclick = run;
  };
  const pscene = (k, cur, over) => a.scene === 'water' ? PSC.water(k, cur, over) : a.scene === 'stairs' ? PSC.stairs(k) : a.scene === 'jump' ? PSC.jump(k, cur) : PSC.counter(k, cur, a.unitLabel || '번', T.n);
  const scene = (k, cur, over) => { const s = $('[data-scene]', host); if (s) s.innerHTML = pscene(k, cur, over); };
  const ctl = dnd(host, {
    onTap: el => { if (el.dataset.drag[0] === 'A' && !running) { setAct(el.dataset.drag.slice(1)); } return true; },
    onDrop: (el, d) => { if (running) return; if (el.dataset.drag[0] === 'A' && d.dataset.drop === 'body') setAct(el.dataset.drag.slice(1)); if (el.dataset.drag === 'B' && d.dataset.drop === 'pool' && !a.fix) { act = null; render(); } }
  });
  const setAct = id => {
    act = id; render();
    if (a.guided) P.say(id === T.a ? `좋아! <b>${esc(actT(id))}</b>를 반복 안에 넣었어. 이제 − / + 버튼으로 <b>몇 번</b> 반복할지 정해 볼까?` : `음, 우리가 반복할 행동은 <b>${esc(actT(id))}</b>가 맞을까? ${enc()}`, id === T.a ? 'yay' : 'think');
  };
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-n]'); if (b && !running) { n = Math.max(1, Math.min(9, n + +b.dataset.n)); render(); if (a.guided) P.say(`지금 반복 횟수는 <b>${n}번</b>이야.${n === T.n ? ' 목표와 같아! 이제 <b>▶ 실행하기</b>를 눌러 봐.' : ''}`, n === T.n ? 'yay' : 'happy'); }
    if (e.target.closest('[data-rm]') && !running) { act = null; render(); }
  });
  const run = () => {
    if (!act) { P.wrong(); P.say('반복 블록 안이 비어 있어! 먼저 <b>반복할 행동 카드</b>를 넣어 줘.', 'think'); return; }
    running = true; render(); let k = 0;
    P.say(`🔁 ${n}번 반복을 시작할게! 하나씩 세어 보자.`, 'happy');
    const step = () => {
      k++; const over = a.scene === 'water' && act === 'water' && k > 3;
      scene(k, act, over);
      if (k < n && !over) P.after(step, 650); else P.after(() => end(k, over), 500);
    };
    P.after(step, 400);
  };
  const end = (k, over) => {
    running = false; ranOnce = true; render(k, act, over);
    const nm = esc(actT(act));
    if (act !== T.a) { P.wrong(); P.say(`앗, <b>${nm}</b>를 ${k}번 했어! 우리가 반복해야 할 행동은 이게 아니야. 행동 카드를 다시 골라 볼까?`, 'oops'); return; }
    if (over) { P.wrong(); P.say(`화분은 3개뿐인데 ${n}번 반복해서 물을 줄 곳이 없어졌어! 화분 수와 반복 횟수를 비교해 봐.`, 'oops'); return; }
    if (n < T.n) { P.wrong(); P.say(`${nm}를 <b>${n}번</b> 했어. 목표는 <b>${T.n}번</b>이야! 몇 번이 더 필요할까?<br><small>${a.fix ? '반복 횟수가 문제였구나! 숫자를 고쳐 보자.' : enc()}</small>`, 'think'); return; }
    if (n > T.n) { P.wrong(); P.say(`앗, ${nm}를 <b>${n}번</b>이나 했어! 목표는 <b>${T.n}번</b>이야. 반복 횟수를 줄여 볼까?`, 'oops'); return; }
    solved = true; P.done(a.final || `정확히 ${T.n}번 반복했어! 반복할 행동과 횟수를 모두 알맞게 정했기 때문이야.`);
  };
  P.setReveal(() => { act = T.a; n = T.n; ranOnce = true; render(); P.say(`정답은 <b>${esc(actT(T.a))}</b>를 <b>${T.n}번</b> 반복하는 거야. <b>▶ 실행하기</b>로 확인해 보고, <b>↺ 다시 하기</b>로 직접 풀어 봐!`, 'think'); });
  render();
  P.say(a.intro || '반복 블록을 완성해 보자!', 'happy');
};

/* ========== 상황별 행동 고르기 ========== */
ACT.choose = (host, a, P) => {
  const put = {};
  P.how(['① 아래 행동 카드를 누른 다음, 알맞은 <b>상황 칸</b>을 눌러 봐.', '② 카드를 상황 칸으로 끌어다 놓아도 돼.', '③ 두 상황을 모두 채우면 완성!']);
  const render = () => {
    host.innerHTML = `<div class="pchoose">${a.situations.map(s => `<div class="psitbox" data-drop="${s.id}"><div class="pscene sm">${PSC.weather(s.rain, put[s.id] || null, s.t)}</div>
        <div class="pzone">${put[s.id] ? `<div class="pcard2 good"><span class="pe">${a.actions.find(x => x.id === put[s.id]).e}</span>${esc(a.actions.find(x => x.id === put[s.id]).t)}</div>` : '<div class="pslot">어떤 행동을 할까? 카드를 여기에!</div>'}</div></div>`).join('')}</div>
      <div class="psub" style="margin-top:12px">🃏 행동 카드 <small>눌러서 고른 뒤 상황 칸을 눌러</small></div><div class="plist pool row">${a.actions.map(x => `<div class="pcard2" data-drag="${x.id}"><span class="pe">${x.e}</span>${esc(x.t)}</div>`).join('')}</div>`;
    ctl.clear();
  };
  const ctl = dnd(host, {
    onPick: el => P.say(`<b>${esc(a.actions.find(x => x.id === el.dataset.drag).t)}</b> 카드를 골랐어. 이제 이 행동이 어울리는 <b>상황 칸</b>을 눌러 봐!`, 'happy'),
    onDrop: (el, d) => {
      const sid = d.dataset.drop, aid = el.dataset.drag;
      if (a.answer[sid] === aid) { put[sid] = aid; render(); const left = a.situations.filter(s => !put[s.id]); P.say(a.why[sid] + (left.length ? '<br>이제 다른 상황도 채워 볼까?' : ''), 'yay'); if (!left.length) P.after(() => P.done(a.final), 900); }
      else { P.wrong(); P.say(`${a.wrongWhy[sid]}<br><small>${enc()}</small>`, 'think'); }
    }
  });
  P.setReveal(() => { Object.assign(put, a.answer); render(); P.say('두 상황의 알맞은 행동을 보여 줬어. 조건에 따라 행동이 달라지는 걸 확인하고 <b>↺ 다시 하기</b>로 직접 해 봐!', 'think'); });
  render(); P.say(a.intro, 'happy');
};

/* ========== 선 잇기(조건 ↔ 행동, 기호 ↔ 뜻) ========== */
ACT.connect = (host, a, P) => {
  const links = {}; let pick = null, solved = false, t = 3;
  P.how(['① 왼쪽 카드를 먼저 눌러 봐.', '② 그다음 짝이 되는 오른쪽 카드를 누르면 선이 이어져.', '③ 모든 짝을 이으면 완성!']);
  const render = () => {
    host.innerHTML = `<div class="pconn"><svg class="plines"></svg><div class="pcolL">${a.left.map(x => `<button class="pnode ${pick === x.id ? 'picked' : ''} ${links[x.id] ? 'done' : ''}" data-l="${x.id}"><span class="pe">${x.e}</span>${esc(x.t)}</button>`).join('')}</div>
      <div class="pcolR">${a.right.map(x => `<button class="pnode ${Object.values(links).includes(x.id) ? 'done' : ''}" data-r="${x.id}"><span class="pe">${x.e}</span>${esc(x.t)}</button>`).join('')}</div></div>
      ${solved && a.after === 'temp' ? `<div class="pact-row" style="flex-direction:column;align-items:stretch"><div class="psub">🌡️ 기온을 바꿔서 결과를 관찰해 봐!</div><input type="range" min="-5" max="35" value="${t}" data-t style="accent-color:#5fd4ff;width:100%"><div class="pscene sm" data-scene>${PSC.temp(t, t < 10)}</div></div>` : ''}`;
    draw();
    const sl = $('[data-t]', host); if (sl) sl.oninput = () => { t = +sl.value; $('[data-scene]', host).innerHTML = PSC.temp(t, t < 10); };
  };
  const draw = () => {
    const svg = $('.plines', host), box = $('.pconn', host).getBoundingClientRect();
    svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
    svg.innerHTML = Object.entries(links).map(([l, r]) => { const A = $(`[data-l="${l}"]`, host).getBoundingClientRect(), Bb = $(`[data-r="${r}"]`, host).getBoundingClientRect(); return `<path d="M${A.right - box.left},${A.top + A.height / 2 - box.top} C${A.right - box.left + 60},${A.top + A.height / 2 - box.top} ${Bb.left - box.left - 60},${Bb.top + Bb.height / 2 - box.top} ${Bb.left - box.left},${Bb.top + Bb.height / 2 - box.top}" stroke="#4be3a5" stroke-width="4" fill="none"/>`; }).join('');
  };
  host.addEventListener('click', e => {
    if (solved) return;
    const l = e.target.closest('[data-l]'), r = e.target.closest('[data-r]');
    if (l) { if (links[l.dataset.l]) return; pick = l.dataset.l; render(); P.say(`"<b>${esc(a.left.find(x => x.id === pick).t)}</b>" 일 때는 어떻게 해야 할까? 오른쪽에서 골라 봐!`, 'happy'); }
    if (r) {
      if (!pick) { P.say('먼저 <b>왼쪽 카드</b>를 눌러 줘!', 'think'); return; }
      if (a.pairs[pick] === r.dataset.r) { links[pick] = r.dataset.r; const w = a.why[pick]; pick = null; render(); const left = a.left.filter(x => !links[x.id]).length;
        if (!left) { solved = true; render(); P.done(a.final); } else P.say(w + '<br>남은 카드도 이어 볼까?', 'yay'); }
      else { P.wrong(); P.say(`${a.wrong[pick] || '이 짝이 맞을까?'}<br><small>${enc()}</small>`, 'think'); r.classList.add('shake'); setTimeout(() => r.classList.remove('shake'), 450); }
    }
  });
  P.setReveal(() => { Object.assign(links, a.pairs); solved = true; render(); P.say('알맞은 짝을 보여 줬어! 왜 이렇게 연결되는지 읽어 보고 <b>↺ 다시 하기</b>로 직접 이어 봐.', 'think'); });
  render(); P.say(a.intro, 'happy');
  const ro = () => { if (document.body.contains(host)) draw(); }; window.addEventListener('resize', ro); P.onClean(() => window.removeEventListener('resize', ro));
};

/* ========== 만약 ~라면 / 아니면 블록 만들기 ========== */
ACT.ifbuild = (host, a, P) => {
  const style = a.style || 'card';
  let c = a.fix ? a.fix.c : a.fixedCond || null, th = a.fix ? a.fix.then : null, el = a.fix ? a.fix.els : null;
  let scen = a.scen[0].id, passed = new Set(), ranFirst = false, solved = false, out = null;
  const actOf = id => a.actions.find(x => x.id === id), condOf = id => a.conds.find(x => x.id === id);
  P.how(a.fix ? ['① 먼저 <b>' + a.scen[0].label + '</b>로 <b>▶ 실행해 보기</b>를 눌러 봐.', '② 무엇이 잘못됐는지 찾았다면 칸의 카드를 ✕로 빼고 알맞은 카드를 넣어 봐.', '③ 두 상황을 모두 실행해서 확인!']
    : [a.fixedCond ? '① 조건은 이미 정해져 있어.' : '① <b>조건 칸</b>을 눌러 조건을 골라 봐.', '② 행동 카드를 누른 뒤 <b>"' + (style === 'nl' ? '라면' : '만약') + '" 칸</b> 또는 <b>"' + (style === 'nl' ? '그렇지 않다면' : '아니면') + '" 칸</b>을 눌러 넣어 봐. (끌어도 돼!)', '③ 위쪽 상황 버튼을 바꿔 가며 <b>▶ 실행해 보기</b>로 두 상황을 모두 확인해!']);
  const cardHTML = (id, z) => { const x = actOf(id); return `<div class="pcard2 in" data-drag="Z${z}"><span class="pe">${x.e}</span>${esc(x.t)}<span class="ptools"><button data-x="${z}" class="del">✕</button></span></div>`; };
  const W = style === 'pc' ? { if: '만약', ifEnd: ':', els: '아니면:' } : style === 'nl' ? { if: '만약', ifEnd: '면,', els: '그렇지 않다면,' } : { if: '🔀 만약', ifEnd: '라면', els: '↳ 아니면' };
  const render = () => {
    const ct = c ? condOf(c).t : '조건 고르기 ▾';
    host.innerHTML = `<div class="pifwrap"><div class="pcol" style="flex:1.15">${a.situation ? `<div class="psit">${a.situation}</div>` : ''}
      <div class="pif ${style}"><div class="pif-h ${out && out.branch === 't' ? 'run' : ''}"><span class="kw">${W.if}</span>${a.fixedCond || a.fix ? `<span class="condchip fixed">${esc(ct)}</span>` : `<button class="condchip" data-cond>${esc(ct)}</button>`}<span class="kw">${W.ifEnd}</span></div>
        <div class="pif-b ${out && out.branch === 't' ? 'run' : out ? 'dim' : ''}" data-drop="t">${th ? cardHTML(th, 't') : '<div class="pslot">조건이 맞을 때 할 행동</div>'}</div>
        <div class="pif-h ${out && out.branch === 'e' ? 'run' : ''}"><span class="kw">${W.els}</span></div>
        <div class="pif-b ${out && out.branch === 'e' ? 'run' : out ? 'dim' : ''}" data-drop="e">${el ? cardHTML(el, 'e') : '<div class="pslot">조건이 맞지 않을 때 할 행동</div>'}</div></div>
      ${a.fix ? '' : `<div class="psub" style="margin-top:12px">🃏 행동 카드</div><div class="plist pool row">${a.actions.map(x => `<div class="pcard2" data-drag="A${x.id}"><span class="pe">${x.e}</span>${esc(x.t)}</div>`).join('')}</div>`}
      ${a.fix && ranFirst ? `<div class="psub" style="margin-top:12px">🃏 바꿀 행동 카드</div><div class="plist pool row">${a.actions.map(x => `<div class="pcard2" data-drag="A${x.id}"><span class="pe">${x.e}</span>${esc(x.t)}</div>`).join('')}</div>` : ''}
      </div>
      <div class="pcol" style="flex:1"><div class="psub">🖥️ 실행 화면 <small>상황을 바꿔 가며 실행해 봐</small></div>
        <div class="pseg">${a.scen.map(s => `<button class="scbtn ${s.id === scen ? 'on' : ''}" data-sc="${s.id}">${s.label}${passed.has(s.id) ? ' ✔' : ''}</button>`).join('')}</div>
        <div class="pscene" data-scene>${sceneOf(scen, out ? out.act : null)}</div>
        <div class="pact-row"><button class="btn go" data-run>▶ 실행해 보기</button><span class="pmini">확인한 상황 ${passed.size}/${a.scen.length}</span></div></div></div>`;
    ctl.clear();
    $('[data-run]', host).onclick = run;
  };
  const sceneOf = (sid, act) => a.scene === 'weather' ? PSC.weather(sid === 'r', act, a.scen.find(s => s.id === sid).label) : a.scene === 'signal' ? PSC.signal(sid === 'g', act) : PSC.homework(sid === 'y', act);
  const changed = () => { passed.clear(); out = null; render(); };
  const ctl = dnd(host, {
    onPick: el2 => P.say(`<b>${esc(actOf(el2.dataset.drag.slice(1)).t)}</b> 카드를 골랐어. 이제 넣을 칸을 눌러 봐!`, 'happy'),
    onTap: el2 => { if (el2.dataset.drag[0] === 'Z') return true; },
    onDrop: (el2, d) => {
      const id = el2.dataset.drag; if (id[0] !== 'A' || (a.fix && !ranFirst)) return;
      if (d.dataset.drop === 't') th = id.slice(1); else if (d.dataset.drop === 'e') el = id.slice(1); else return;
      changed(); P.say('카드를 넣었어! 상황을 골라 <b>▶ 실행해 보기</b>로 확인해 봐.', 'happy');
    }
  });
  host.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if (x) { if (a.fix && !ranFirst) { P.say('먼저 <b>▶ 실행해 보기</b>로 무엇이 잘못됐는지 확인해 볼까?', 'think'); return; } if (x.dataset.x === 't') th = null; else el = null; changed(); return; }
    const sc = e.target.closest('[data-sc]'); if (sc) { scen = sc.dataset.sc; out = null; render(); return; }
    const cd = e.target.closest('[data-cond]');
    if (cd) { const md = modal(`<h2>조건 고르기</h2><p style="margin:0;color:var(--tx2);font-weight:600">어떤 조건을 확인할까?</p><div class="picklist">${a.conds.map(k => `<button data-c="${k.id}">만약 ${esc(k.t)}</button>`).join('')}</div>`); $$('[data-c]', md).forEach(b => b.onclick = () => { c = b.dataset.c; md.close(); changed(); P.say(`조건을 "<b>${esc(condOf(c).t)}</b>"로 정했어. 이제 각 칸에 행동을 넣어 볼까?`, 'happy'); }); }
  });
  const run = () => {
    if (!c) { P.wrong(); P.say('먼저 <b>조건 칸</b>을 눌러 조건을 골라 줘!', 'think'); return; }
    if (!th || !el) { P.wrong(); P.say(`아직 비어 있는 칸이 있어! ${!th ? '"조건이 맞을 때"' : '"조건이 맞지 않을 때"'} 할 행동을 넣어 줘.`, 'think'); return; }
    const S = a.scen.find(s => s.id === scen), truth = !!S.truth[c], act = truth ? th : el;
    out = { branch: truth ? 't' : 'e', act }; ranFirst = true;
    const ok = a.expect[scen] === act;
    if (ok) passed.add(scen); else passed.delete(scen);
    render();
    const ifTxt = condOf(c).t;
    if (ok) {
      const rest = a.scen.filter(s => !passed.has(s.id));
      if (!rest.length) { solved = true; P.done(a.final); }
      else P.say(`${S.label}: 조건 "${esc(ifTxt)}" → <b>${truth ? '예' : '아니오'}</b>! 그래서 <b>${esc(actOf(act).t)}</b>를 실행했어. 알맞아! 👍<br>이번에는 <b>${rest[0].label}</b>로 바꿔서 실행해 볼까?`, 'yay');
    } else { P.wrong(); P.say(`${S.label}: 조건 "${esc(ifTxt)}" → <b>${truth ? '예' : '아니오'}</b>라서 <b>${esc(actOf(act).t)}</b>를 실행했어.<br>${a.wrongMsg ? a.wrongMsg(scen, act) : '이 상황에 맞는 행동일까?'}<br><small>${a.fix ? '어느 칸의 행동이 잘못 들어 있는지 찾아서 바꿔 보자!' : enc()}</small>`, 'oops'); }
  };
  P.setReveal(() => { c = a.answer.c; th = a.answer.t; el = a.answer.e; ranFirst = true; changed(); P.say('정답 블록을 보여 줬어. 상황을 바꿔 가며 실행해 보고, <b>↺ 다시 하기</b>로 직접 만들어 봐!', 'think'); });
  render(); P.say(a.intro, a.fix ? 'think' : 'happy');
};

/* ========== 문장·코드 빈칸 완성 ========== */
ACT.compose = (host, a, P) => {
  a.rounds.forEach(x => { x._bad = []; });
  let r = 0, vals = {}, active = null, solved = false;
  P.how(['① 빈칸 <b>[ 고르기 ▾ ]</b>을 눌러 봐.', '② 아래에 나오는 낱말 중 알맞은 것을 골라 빈칸을 채워.', '③ 다 채웠으면 <b>확인하기</b>를 눌러!']);
  const R = () => a.rounds[r];
  const render = () => {
    const rd = R();
    host.innerHTML = `${rd.lead ? `<div class="psit">${rd.lead}</div>` : ''}<div class="pcompose ${a.style || 'nl'}">${rd.lines.map(line => `<div class="pline">${line.map(p => typeof p === 'string' ? `<span>${esc(p)}</span>` : `<button class="pblank ${active === p.slot ? 'on' : ''} ${vals[p.slot] != null ? 'filled' : ''} ${rd._bad && rd._bad.includes(p.slot) ? 'bad' : ''}" data-s="${p.slot}">${vals[p.slot] != null ? esc(vals[p.slot]) : '고르기 ▾'}</button>`).join('')}</div>`).join('')}</div>
      ${active ? `<div class="popts"><div class="psub">"${'빈칸'}"에 들어갈 말을 골라 봐</div><div class="plist row">${rd.slots[active].map(o => `<button class="pcard2" data-o="${esc(String(o))}">${esc(String(o))}</button>`).join('')}</div></div>` : ''}
      <div class="pact-row"><button class="btn go" data-chk ${solved ? 'disabled' : ''}>✔ 확인하기</button>${a.rounds.length > 1 ? `<span class="pmini">문제 ${r + 1}/${a.rounds.length}</span>` : ''}<div class="pplayhost" data-play style="flex:1"></div></div>`;
    $('[data-chk]', host).onclick = check;
  };
  host.addEventListener('click', e => {
    const s = e.target.closest('[data-s]'); if (s && !solved) { active = s.dataset.s; if (R()._bad) R()._bad = R()._bad.filter(x => x !== active); render(); return; }
    const o = e.target.closest('[data-o]'); if (o && active) { const v = o.dataset.o; vals[active] = isNaN(+v) || v === '' ? v : +v; const order = R().order || Object.keys(R().slots); const next = order.find(k => vals[k] == null); active = next || null; render(); }
  });
  const check = () => {
    const rd = R(), miss = Object.keys(rd.slots).filter(k => vals[k] == null);
    if (miss.length) { P.say('아직 비어 있는 칸이 있어! 모든 빈칸을 채워 줘.', 'think'); active = miss[0]; render(); return; }
    const res = rd.judge(vals);
    if (!res.ok) { P.wrong(); rd._bad = res.bad || []; render(); P.say(`${res.msg}<br><small>${enc()}</small>`, 'think'); return; }
    rd._bad = []; solved = true; render();
    const fin = () => {
      if (r < a.rounds.length - 1) { P.say(res.msg + '<br>좋아! 다음 문제로 넘어갈게.', 'yay'); P.after(() => { r++; vals = {}; active = null; solved = false; render(); P.say(R().intro || '다음 문제야!', 'happy'); }, 1800); }
      else P.done(res.msg);
    };
    if (rd.play) { P.say(res.msg, 'yay'); rd.play($('[data-play]', host), vals, P, fin); } else fin();
  };
  P.setReveal(() => { const rd = R(); Object.assign(vals, rd.answer); solved = false; active = null; render(); P.say('정답을 채워 두었어. 문장을 소리 내어 읽어 보고 <b>확인하기</b>를 눌러 봐!', 'think'); });
  render(); P.say(a.rounds[0].intro || a.intro, 'happy');
};

/* ========== 순서도 기호 분류 ========== */
ACT.shapesort = (host, a, P) => {

    host.innerHTML = `<div class="pbins">${['term', 'proc', 'io', 'dec'].map(sh => `<div class="pbin" data-drop="${sh}"><div class="pbin-h">${FG.mini(sh).replace('width="40" height="30"', 'width="64" height="46"')}<div><b>${SHAPE_INFO[sh].name}</b><small>${SHAPE_INFO[sh].role}</small></div></div>

      <div class="plist pool row">${a.cards.map((c, i) => put[i] ? '' : `<div class="pcard2" data-drag="${i}">${esc(c.t)}</div>`).join('') || '<div class="pempty">모든 카드를 분류했어! 🎉</div>'}</div>`;

  };

  const ctl = dnd(host, {
    onPick: el => P.say(`"<b>${esc(a.cards[+el.dataset.drag].t)}</b>" — 이건 어떤 기호에 들어가야 할까? 위의 기호를 눌러 봐!`, 'happy'),
    onDrop: (el, d) => {
      const i = +el.dataset.drag, c = a.cards[i], sh = d.dataset.drop;
      if (c.shape === sh) { put[i] = sh; render(); const left = a.cards.filter((_, k) => !put[k]).length; P.say(`정답! ${c.why}${left ? '' : ''}`, 'yay'); if (!left) P.after(() => P.done(a.final), 1100); }
      else { P.wrong(); P.say(`"${esc(c.t)}"는 ${SHAPE_INFO[sh].name}이 아니야. ${enc()}<br><small>💡 ${c.shape === 'dec' ? '이 문장이 질문인지 살펴봐!' : c.shape === 'term' ? '알고리즘의 처음이나 마지막을 나타내는 말이지?' : c.shape === 'io' ? '정보를 받아들이거나 보여 주는 일인지 생각해 봐.' : '실제로 행동하는 일인지 생각해 봐.'}</small>`, 'think'); }
    }
  });
  P.setReveal(() => { a.cards.forEach((c, i) => put[i] = c.shape); render(); P.say('모든 카드를 알맞은 기호에 넣어 두었어. 기호의 이름과 뜻을 다시 읽어 보고 <b>↺ 다시 하기</b>로 도전해 봐!<br>' + Object.values(ROLE).join('<br>'), 'think'); });

/* ========== 순서도 빈칸 채우기 ========== */
ACT.fcfill = (host, a, P) => {
  const fill = {};
  P.how(['① 아래 <b>기호 조각</b>을 하나 눌러 골라 봐.', '② 순서도의 <b>점선 빈칸(?)</b>을 누르면 조각이 들어가. (끌어도 돼!)', '③ 모양과 순서가 모두 맞아야 해!']);
  const render = (cur) => {
    const fc = { nodes: a.nodes.map(n => n.blank ? (fill[n.id] ? { ...n, shape: a.pieces.find(p => p.id === fill[n.id]).shape, t: a.pieces.find(p => p.id === fill[n.id]).t } : { ...n, shape: 'proc', t: '?' }) : n), edges: a.edges };
    const svg = FG.staticSVG(fc, { text: n => n.t, maxH: 460, ncls: n => `${n.blank && !fill[n.id] ? 'blank' : ''} ${cur === n.id ? 'cur' : ''}` }).replace(/<g class="fnode ([^"]*)" data-n="([^"]+)">/g, (m0, cls, id) => a.nodes.find(n => n.id === id && n.blank) ? `<g class="fnode ${cls}" data-n="${id}" data-drop="${id}">` : m0);
    host.innerHTML = `<div class="pfcwrap"><div class="pfc">${svg}</div><div class="pcol" style="flex:.8"><div class="psub">🧩 기호 조각</div><div class="plist pool">${a.pieces.map(p => Object.values(fill).includes(p.id) ? '' : `<div class="pcard2" data-drag="${p.id}">${FG.mini(p.shape)}<span>${esc(p.t)}</span></div>`).join('')}</div></div></div>`;
    ctl.clear();
  };
  const ctl = dnd(host, {
    onPick: el => P.say(`조각을 골랐어! 이제 순서도에서 알맞은 <b>? 빈칸</b>을 눌러 봐.`, 'happy'),
    onDrop: (el, d) => {
      const p = a.pieces.find(x => x.id === el.dataset.drag), nid = d.dataset.drop;
      if (!a.nodes.find(n => n.id === nid && n.blank) || fill[nid]) return;
      if (p.ok === nid) { fill[nid] = p.id; render(); P.say(`딱 맞아! ${p.why}`, 'yay'); if (a.nodes.filter(n => n.blank).every(n => fill[n.id])) walk(); }
      else { P.wrong(); P.say(`${p.ok ? (a.nodes.find(n => n.id === p.ok) ? '이 조각은 다른 빈칸에 들어가야 할 것 같아. 화살표를 따라 순서를 생각해 봐!' : '') : p.bad}<br><small>${enc()}</small>`, 'think'); }
    }
  });
  const walk = () => { let k = 0; const seq = a.walk; const step = () => { render(seq[k]); k++; if (k < seq.length) P.after(step, 600); else P.after(() => { render(); P.done(a.final); }, 500); }; P.say('완성! 화살표를 따라 실행되는 순서를 함께 보자!', 'yay'); P.after(step, 300); };
  P.setReveal(() => { a.pieces.forEach(p => { if (p.ok) fill[p.ok] = p.id; }); render(); P.say('알맞은 조각을 넣어 두었어. 모양과 위치를 살펴보고 <b>↺ 다시 하기</b>로 도전해 봐!', 'think'); });
  render(); P.say(a.intro, 'happy');
};

/* ========== 순서도 화살표 연결 ========== */
ACT.fcconnect = (host, a, P) => {
  const fc = { nodes: a.nodes.map(n => ({ ...n })), edges: (a.given || []).map(([from, port, to]) => ({ from, port, to })) };
  let ed, solved = false, prevN = fc.edges.length;
  const nm = id => fc.nodes.find(n => n.id === id).t;
  const key = e => e.from + '|' + e.port + '|' + e.to, exp = new Set(a.expect.map(([f, p, t]) => f + '|' + p + '|' + t));
  P.how(['① 기호 아래(또는 마름모 양옆)의 <b>동그라미</b>를 눌러 봐.', '② 그다음 이어질 <b>기호</b>를 누르면 화살표가 생겨.', '③ 잘못 이은 화살표는 눌러서 <b>삭제</b>할 수 있어.', '④ 다 이었으면 <b>✔ 연결 확인하기</b>!']);
  host.innerHTML = `<div class="pfcwrap"><div class="pfc ed" data-ed style="height:${a.h || 440}px"></div><div class="pcol" style="flex:.7">${a.situation ? `<div class="psit">${a.situation}</div>` : ''}<div class="pact-row" style="flex-direction:column;align-items:stretch"><button class="btn go" data-chk>✔ 연결 확인하기</button><div class="pmini" data-cnt></div></div></div></div>`;
  const cnt = () => { $('[data-cnt]', host).textContent = `연결한 화살표 ${fc.edges.length}개 / 필요한 화살표 ${a.expect.length}개`; };
  ed = new FlowEditor($('[data-ed]', host), { acts: {}, conds: {} }, fc, {
    text: n => n.t, lock: true,
    onChange: () => {
      cnt();
      if (fc.edges.length > prevN) {
        const e = fc.edges[fc.edges.length - 1];
        if (exp.has(key(e))) P.say(`좋아! "<b>${esc(nm(e.from))}</b>"${e.port === 'yes' ? '에서 <b>예</b>일 때' : e.port === 'no' ? '에서 <b>아니오</b>일 때' : ' 다음은'} "<b>${esc(nm(e.to))}</b>"(으)로 가는 게 맞아!`, 'yay');
        else { P.wrong(); P.say(`음, "<b>${esc(nm(e.from))}</b>"${e.port === 'yes' ? '에서 예일 때' : e.port === 'no' ? '에서 아니오일 때' : ' 다음에'} "<b>${esc(nm(e.to))}</b>"(으)로 가는 게 맞을까?<br><small>화살표를 눌러 삭제하고 다시 이어 봐. ${enc()}</small>`, 'think'); }
      }
      prevN = fc.edges.length;
    }
  });
  cnt();
  $('[data-chk]', host).onclick = () => {
    if (solved) return;
    const extra = fc.edges.filter(e => !exp.has(key(e)));
    if (extra.length) { P.wrong(); const e = extra[0]; ed.setHL(null, [e.from]); P.say(`"<b>${esc(nm(e.from))}</b>"에서 나가는 화살표가 잘못 이어져 있어. 그 화살표를 눌러 삭제하고 다시 이어 볼까?`, 'oops'); return; }
    const miss = a.expect.filter(([f, p, t]) => !fc.edges.some(e => key(e) === f + '|' + p + '|' + t));
    if (miss.length) { P.wrong(); const [f, p] = miss[0]; ed.setHL(null, [f]); P.say(`아직 이어지지 않은 곳이 있어! "<b>${esc(nm(f))}</b>"${p === 'yes' ? '의 <b>예</b> 쪽' : p === 'no' ? '의 <b>아니오</b> 쪽' : ' 다음'}은 어디로 가야 할까?`, 'think'); return; }
    solved = true; P.say('완벽해! 이제 화살표를 따라 실행해 볼게. 빛나는 기호를 따라가 봐!', 'yay');
    let k = 0; const seq = a.walk;
    const step = () => { const id = seq[k], prev = seq[k - 1]; const e = prev ? fc.edges.find(x => x.from === prev && x.to === id) : null; ed.setHL(id, [], e ? { from: e.from, port: e.port } : null); if (a.walkSay && a.walkSay[k]) P.say(a.walkSay[k], 'happy'); k++; if (k < seq.length) P.after(step, 750); else P.after(() => { ed.setHL(null, []); P.done(a.final); }, 600); };
    P.after(step, 400);
  };
  P.setReveal(() => { fc.edges.splice(0, fc.edges.length, ...a.expect.map(([from, port, to]) => ({ from, port, to }))); prevN = fc.edges.length; ed.render(); cnt(); P.say('알맞은 화살표를 모두 이어 두었어. 화살표를 따라가 보며 흐름을 이해하고 <b>↺ 다시 하기</b>로 직접 이어 봐!', 'think'); });
  P.say(a.intro, 'happy');
};

/* ========== 의사코드 들여쓰기 ========== */
ACT.indent = (host, a, P) => {
  let pi = 0, ind = a.puzzles[0].lines.map(l => l.ind || 0), solved = false;
  P.how(['① 각 줄 오른쪽의 <b>⇥(안으로)</b> / <b>⇤(밖으로)</b> 버튼으로 들여쓰기를 바꿔 봐.', '② 안으로 들어간 줄은 반복 <b>안</b>, 바깥 줄은 반복이 끝난 <b>뒤</b>에 실행돼.', '③ <b>▶ 실행하기</b>로 결과 횟수를 확인해!']);
  const Z = () => a.puzzles[pi];
  const render = (cnt, cur) => {
    const z = Z();
    host.innerHTML = `<div class="prepwrap"><div class="pcol" style="flex:1.1"><div class="psit">🎯 ${z.goal}</div><div class="pcode">${z.lines.map((l, i) => `<div class="pcl ${cur === i ? 'cur' : ''} ${ind[i] ? 'inside' : ''}"><span class="pgut">${i + 1}</span><span style="width:${ind[i] * 34}px;flex:none" class="${ind[i] ? 'pindbar' : ''}"></span>${l.k === 'mark' ? `<span class="kw2">${l.t}</span>` : l.k === 'rep' ? `<span class="nm">${l.n}</span><span class="kw">번 반복하기:</span>` : esc(l.t)}
        ${l.k === 'act' ? `<span class="ptools"><button data-o="${i}" ${ind[i] ? '' : 'disabled'}>⇤</button><button data-i="${i}" ${ind[i] ? 'disabled' : ''}>⇥</button></span>` : ''}</div>`).join('')}</div>
        <div class="pact-row"><button class="btn go" data-run>▶ 실행하기</button>${a.puzzles.length > 1 ? `<span class="pmini">문제 ${pi + 1}/${a.puzzles.length}</span>` : ''}</div></div>
      <div class="pcol"><div class="psub">🖥️ 실행 결과</div><div class="pscene"><div class="pstage sky" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${Object.keys(z.expect).map(k => `<div class="pcount2"><span class="e">${z.emoji[k]}</span><span>${esc(z.names[k])}</span><b>${cnt ? cnt[k] || 0 : 0}</b>번</div>`).join('')}</div></div></div></div>`;
    $('[data-run]', host).onclick = run;
  };
  host.addEventListener('click', e => {
    const o = e.target.closest('[data-o]'), i = e.target.closest('[data-i]');
    if (o) { ind[+o.dataset.o] = 0; render(); P.say('줄을 <b>밖으로</b> 꺼냈어. 이제 이 명령은 반복이 끝난 뒤에 <b>한 번만</b> 실행돼.', 'happy'); }
    if (i) { ind[+i.dataset.i] = 1; render(); P.say('줄을 <b>안으로</b> 넣었어. 이제 이 명령은 반복할 때마다 실행돼.', 'happy'); }
  });
  const run = () => {
    const z = Z(), ri = z.lines.findIndex(l => l.k === 'rep'), seq = [];
    z.lines.forEach((l, i) => { if (l.k === 'act' && ind[i] && (i < ri)) seq.push('bad'); });
    const body = [], after = [], before = [];
    z.lines.forEach((l, i) => { if (l.k !== 'act') return; if (i > ri && ind[i]) { if (after.length) seq.push('bad'); body.push(i); } else if (i > ri) after.push(i); else before.push(i); });
    if (seq.length) { P.wrong(); P.say('들여쓰기한 줄 위에 반복하기가 없거나, 반복 안 명령 사이에 바깥 줄이 끼어 있어. 반복 안에 넣을 줄은 <b>반복하기 바로 아래에 이어서</b> 들여 써야 해!', 'oops'); return; }
    if (!body.length) { P.wrong(); P.say('반복하기 아래에 들여 쓴 줄이 하나도 없어! 반복할 명령을 안으로 넣어 줘.', 'think'); return; }
    const order = [...before.map(i => [i, 0]), ...Array.from({ length: z.lines[ri].n }, () => body.map(i => [i, 1])).flat(), ...after.map(i => [i, 0])];
    const cnt = {}; let k = 0;
    const step = () => { const [i] = order[k]; const id = z.lines[i].id; cnt[id] = (cnt[id] || 0) + 1; render(cnt, i); k++; if (k < order.length) P.after(step, 380); else P.after(() => end(cnt), 300); };
    P.say('▶ 위에서부터 한 줄씩 실행할게!', 'happy'); step();
  };
  const end = cnt => {
    const z = Z(), wrong = Object.keys(z.expect).filter(k => (cnt[k] || 0) !== z.expect[k]);
    render(cnt);
    if (wrong.length) { P.wrong(); const k = wrong[0]; P.say(`<b>${esc(z.names[k])}</b>를 ${cnt[k] || 0}번 했어! 목표는 <b>${z.expect[k]}번</b>이야.<br>${(cnt[k] || 0) > z.expect[k] ? '반복 안에 들어 있어서 여러 번 실행된 것 같아. 밖으로 꺼내 볼까?' : '반복 밖에 있어서 한 번만 실행된 것 같아. 안으로 넣어 볼까?'}`, 'oops'); return; }
    if (pi < a.puzzles.length - 1) { P.say(`${z.done} 다음 문제로 넘어갈게!`, 'yay'); P.after(() => { pi++; ind = Z().lines.map(l => l.ind || 0); render(); P.say(Z().intro, 'happy'); }, 2000); }
    else P.done(z.done + '<br>들여쓰기 하나로 실행 횟수가 달라진다는 걸 알았지? 이게 의사코드의 핵심이야!');
  };
  P.setReveal(() => { ind = Z().lines.map(l => l.ans || 0); render(); P.say('정답 들여쓰기로 바꿔 두었어. <b>▶ 실행하기</b>로 결과를 확인해 봐!', 'think'); });
  render(); P.say(a.puzzles[0].intro, 'happy');
};

/* ========== 직접 만들기 (순서도·자연어·의사코드) — 미션과 같은 엔진으로 실행·채점 ========== */
ACT.fcbuild = ACT.treebuild = (host, a, P) => {
  const m = a.mk(), isFC = m.repr === 'fc', pc = m.repr === 'pc', prog = isFC ? { nodes: [], edges: [] } : [], lv = {};
  let ed, solved = false, busy = false;
  const T = l => Engine.labelText(m, l, m.repr);
  P.how(isFC
    ? ['① 위쪽 <b>기호 버튼</b>을 눌러 기호를 놓아.', '② 놓은 기호가 선택되면 <b>내용 고르기</b>를 눌러 들어갈 내용을 정해.', '③ <b>동그라미 → 다음 기호</b> 순서로 눌러 화살표를 이어.', '④ <b>▶ 실행해서 확인하기</b>를 눌러 봐!']
    : ['① 위쪽 <b>카드</b>를 눌러 작업 영역에 넣어. 새 카드는 <b>선택한 자리</b>에 들어가.', '② 반복·만약 카드 안에 넣으려면 그 카드의 <b>빈칸(＋)</b>을 먼저 눌러.', '③ 숫자는 <b>− / +</b>, 조건은 <b>조건 칩</b>을 눌러 바꿔.', '④ <b>▶ 실행해서 확인하기</b>를 눌러 봐!']);
  const shapes = ['term', 'proc', 'io', 'dec'], lab = { rep: pc ? '□번 반복하기:' : '다음을 □번 반복한다.', ifelse: pc ? '만약 ~이면: / 아니면:' : '만약 ~라면, / 그렇지 않다면,', if: pc ? '만약 ~이면:' : '만약 ~라면,' };
  const pal = isFC ? shapes.map(sh => `<button class="pcard shape" data-shape="${sh}">${FG.mini(sh)}<span>${SHAPE_INFO[sh].name}<br><small>${SHAPE_INFO[sh].role}</small></span></button>`).join('')
    : (m.palette.marks ? `<button class="pcard mk" data-mk="start"><span class="kw2">시작</span></button><button class="pcard mk" data-mk="end"><span class="kw2">끝</span></button>` : '')
      + m.palette.acts.map(k => `<button class="pcard" data-a="${k}"><span class="pi">${m.acts[k].shape === 'io' ? '⇄' : '▸'}</span><span>${esc(pc ? m.acts[k].p : m.acts[k].t)}</span></button>`).join('')
      + m.palette.blocks.map(k => `<button class="pcard blk ${k === 'rep' ? '' : 'if'}" data-blk="${k}"><span class="pi">${k === 'rep' ? '🔁' : '🔀'}</span><span>${lab[k]}</span></button>`).join('');
  host.innerHTML = `<div class="pfcwrap"><div class="pcol" style="flex:1.5;min-width:0">
    <div class="${isFC ? 'pshapes' : 'pshapes ptpal'}">${pal}</div>
    <div class="pfc ed ${isFC ? '' : 'tree'}" data-ed style="flex:none;height:${a.h || 440}px"></div></div>
   <div class="pcol" style="flex:.8"><div class="psit">🎯 ${a.situation}</div>
    ${isFC ? `<div class="psub">🧩 쓸 수 있는 내용 카드</div><div class="pchips">${m.palette.acts.map(k => `<span class="pchip">${esc(T(k))}</span>`).join('')}${(m.palette.conds || []).map(k => `<span class="pchip q">${esc(T(k))}</span>`).join('')}</div>` : ''}
    <div class="pact-row" style="flex-direction:column;align-items:stretch"><button class="btn go" data-chk>▶ 실행해서 확인하기</button><div class="pmini" data-cnt></div></div>
    <div class="plog" data-log></div></div></div>`;
  const log = t => { $('[data-log]', host).innerHTML = t; };
  const cnt = () => { $('[data-cnt]', host).textContent = isFC ? `놓은 기호 ${prog.nodes.length}개 · 화살표 ${prog.edges.length}개` : `쓴 카드 ${(() => { let c = 0; Engine.walk(prog, () => c++); return c; })()}개`; };
  const onChange = () => { cnt(); if (!solved) log(''); };
  if (isFC) {
    $$('[data-shape]', host).forEach(b => b.onclick = () => { if (!solved && !busy) ed.addNode(b.dataset.shape); });
    ed = new FlowEditor($('[data-ed]', host), m, prog, { where: '위쪽', onChange });
  } else {
    ed = new TreeEditor($('[data-ed]', host), m, prog, { onChange });
    $('.pshapes', host).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || solved || busy) return;
      if (b.dataset.a) ed.insert(B.A(b.dataset.a));
      if (b.dataset.mk) ed.insert(b.dataset.mk === 'start' ? B.S() : B.E());
      if (b.dataset.blk) { const k = b.dataset.blk; ed.insert(k === 'rep' ? B.R(2, []) : B.I(m.palette.conds[0], [], k === 'ifelse' ? [] : null)); P.say(k === 'rep' ? '🔁 반복 블록을 넣었어! 반복할 명령은 이 블록의 <b>빈칸</b>을 누른 뒤 카드를 눌러야 안으로 들어가.' : '🔀 만약 블록을 넣었어! <b>조건 칩</b>을 눌러 조건을 바꾸고, 빈칸을 눌러 그 안에 명령을 넣어 봐.', 'happy'); }
    });
  }
  cnt();
  const hintFor = (key, hints, say) => { const k = (lv[key] = (lv[key] || 0) + 1), n = Math.min(k, hints.length); return `<b>${say}</b><br>💡 <small>힌트 ${n}/${hints.length}</small> ${hints[n - 1].replace(/왼쪽/g, '위쪽')}`; };
  $('[data-chk]', host).onclick = () => {
    if (solved || busy) return;
    const r = Engine.verify(m, prog);
    if (r.ok) { play(); return; }
    P.wrong();
    if (r.phase === 'syntax') { const e = r.errors[0]; ed.setHL(null, r.errors.map(x => x.src).filter(Boolean)); P.say(hintFor(e.key, e.hints, '아직 완성되지 않았어!'), 'think'); log(`<div class="pbad">${esc(e.hints[0].replace(/왼쪽/g, '위쪽'))}</div>`); }
    else {
      const e = r.err; ed.setHL(null, r.src ? [r.src] : []);
      P.say(hintFor(e.key, e.hints, e.say), 'oops');
      log(`<div class="pbad">${r.sc && m.scenarios.length > 1 ? `<small>상황: ${esc(r.sc.label)}</small><br>` : ''}${esc(e.say)}</div>`);
    }
  };
  const play = () => {
    busy = true; ed.setHL(null, []);
    const seqs = m.scenarios.map(sc => { const w = m.init(sc), r = Engine.runAll(Engine.compile(m, prog), m, w); return { sc, ev: r.events.filter(e => e.src || e.kind === 'mark') }; });
    let si = 0, k = 0;
    P.say('좋아, 모든 상황에서 문제없이 실행돼! 이제 실행하는 모습을 볼게. 빛나는 곳을 따라가 봐!', 'yay');
    const step = () => {
      const { sc, ev } = seqs[si];
      if (k < ev.length) {
        const e = ev[k++];
        if (e.src) ed.setHL(e.src, []);
        const t = e.kind === 'br' ? `◆ ${isFC ? '' : '만약 '}${T(e.c)} → <b>${e.v ? '예' : '아니오'}</b>` : e.kind === 'do' ? `▶ ${T(e.a)}` : e.kind === 'loop' ? `🔁 반복 ${e.iter}/${e.n}번째` : e.label === 'start' ? '● 시작' : '● 끝';
        log(`${m.scenarios.length > 1 ? `<small>상황 ${si + 1}/${m.scenarios.length}: ${esc(sc.label)}</small><br>` : ''}${t}`);
        P.after(step, 620);
      } else if (++si < seqs.length) { k = 0; P.after(step, 700); }
      else { ed.setHL(null, []); solved = true; busy = false; P.done(a.final); }
    };
    P.after(step, 700);
  };
  P.setReveal(() => {
    const ans = a.answer();
    if (isFC) { prog.nodes = ans.nodes.map(n => ({ ...n })); prog.edges = ans.edges.map(e => ({ ...e })); ed.sel = null; ed.render(); }
    else { prog.splice(0, prog.length, ...clone(ans)); ed.sel = null; ed.target = null; ed.render(); }
    cnt(); P.say('정답을 놓아 두었어. 살펴본 다음 <b>↺ 다시 하기</b>로 직접 만들어 봐! <b>▶ 실행해서 확인하기</b>도 눌러 볼 수 있어.', 'think');
  });
  P.say(a.intro, 'happy');
};

/* =====================================================================
   연습모드 콘텐츠 · 강의 화면 도우미 · 1단계/2단계 화면 · 새 메인 화면
===================================================================== */
const STEPS = [null, { n: 'STEP 1', t: '선생님이 알려 줄게!', ic: '👩‍🏫' }, { n: 'STEP 2', t: '선생님과 함께 해 볼까?', ic: '🤝' }, { n: 'STEP 3', t: '이번에는 혼자 해 볼까?', ic: '💪' }, { n: 'STEP 4', t: '잘했어! 응용 문제에 도전해 보자!', ic: '🚀' }];

/* ---------- 강의 그림 도우미 ---------- */
const V = {
  html: h0 => el => { el.innerHTML = h0; },
  strip: (steps, opt = {}) => (el, P) => {
    let k = -1;
    const draw = () => { el.innerHTML = `${opt.title ? `<div class="vtitle">${opt.title}</div>` : ''}<div class="pplay big">${steps.map((s, i) => `<div class="pstep ${i < k ? 'past' : ''} ${i === k ? 'now' : ''}"><span class="e">${s.e}</span><span class="t">${opt.num === false ? '' : (i + 1) + '. '}${esc(s.t)}</span></div>${i < steps.length - 1 ? '<span class="parr">➜</span>' : ''}`).join('')}</div>${opt.note ? `<div class="vnote">${opt.note}</div>` : ''}`; };
    const tick = () => { k = k >= steps.length ? -1 : k + 1; draw(); P.after(tick, k === steps.length - 1 ? 1600 : k === -1 ? 400 : 900); };
    draw(); P.after(tick, 300);

  compare: (good, bad, gRes, bRes, gTitle = '✔ 올바른 순서', bTitle = '✖ 잘못된 순서') => (el, P) => {

    const show = (box, arr, k, res) => { box.innerHTML = `<div class="pplay col">${arr.map((s, i) => `<div class="pstep ${i < k ? 'past' : ''} ${i === k ? 'now' : ''}"><span class="e">${s.e}</span><span class="t">${i + 1}. ${esc(s.t)}</span></div>`).join('')}</div>${res ? `<div class="vres">${res}</div>` : ''}`; };
    const play = (box, arr, res) => { let k = -1; const t = () => { k++; show(box, arr, k, k >= arr.length ? res : ''); if (k < arr.length) P.after(t, 650); }; t(); };
    show($('[data-g]', el), good, -1); show($('[data-b]', el), bad, -1);

  symbols: (el, P) => {

    let cur = null;
    const draw = () => { el.innerHTML = `<div class="vsyms">${info.map(([k, n], i) => `<button class="vsym ${cur === i ? 'on' : ''}" data-i="${i}">${k === 'arrow' ? '<svg width="64" height="46" viewBox="0 0 64 46"><path d="M32 4V34" stroke="#8fb6ff" stroke-width="4"/><path d="M22 30l10 14 10-14z" fill="#8fb6ff"/></svg>' : FG.mini(k).replace('width="40" height="30"', 'width="64" height="46"')}<b>${n}</b></button>`).join('')}</div>
      <div class="vnote big">${cur == null ? '👆 기호를 하나씩 눌러 봐!' : `<b>${info[cur][1]}</b>: ${info[cur][2]}<br><small>예) ${info[cur][3]}</small>`}</div>`; $$('[data-i]', el).forEach(b => b.onclick = () => { cur = +b.dataset.i; draw(); }); };
    draw();
  }
};
function V_twothings() {

const PR = {
  rec(area) { return Store.d.prac[area] || (Store.d.prac[area] = {}); },
  done(area) { const A = PRACTICE.find(x => x.id === area); return A.acts.filter((_, i) => this.rec(area)[i]).length; },
  complete(area) { const A = PRACTICE.find(x => x.id === area); return this.done(area) === A.acts.length; },
  areasDone() { return PRACTICE.filter(A => this.complete(A.id)).length; },
  totalDone() { return PRACTICE.reduce((s, A) => s + this.done(A.id), 0); },
  total() { return PRACTICE.reduce((s, A) => s + A.acts.length, 0); }
};

  const ALG = [[['→', '오른쪽으로 1칸'], ['→', '오른쪽으로 1칸'], ['↓', '아래로 1칸'], ['→', '오른쪽으로 1칸']], [['↓', '아래로 1칸'], ['→', '오른쪽으로 1칸'], ['→', '오른쪽으로 1칸'], ['→', '오른쪽으로 1칸']]];
  const walls = ['1,0'];

}

    <div class="st-h"><span class="st-n">${n}단계</span><div style="flex:1"><h3>${title}</h3><p>${sub}</p></div><button class="btn ${recd ? 'go' : 'pri'}" data-st="${to}">${d ? '계속하기' : '시작하기'} →</button></div>
    ${chips ? `<div class="st-chips">${chips}</div>` : ''}
    <div class="st-bar"><div class="bar"><i style="width:${Math.min(100, d / tot * 100)}%"></i></div><span>${unit} ${d}/${tot}</span></div></div>`;
}

Store.load();
go('home');
</script>
</body>
</html>
